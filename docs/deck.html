<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>India's Wide-Body Window: deck</title>
<meta name="description" content="Slide view of the India's Wide-Body Window case: where should Indian carriers deploy their next 100 long-haul aircraft?"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<meta name="theme-color" content="#CC0000"/>
<link rel="stylesheet" href="assets/style.css"/>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
</head>
<body class="deck">

<!-- Like report.html, this page holds no prose. It reads index.html and lays the
     same steps out one per screen, so the deck cannot drift from the site. What
     it adds is pacing: one claim and one exhibit per slide, arrow keys to move,
     which is how a case actually gets walked through in five minutes. -->

<div class="deck-bar">
  <a href="index.html">&larr; Full version</a>
  <span id="counter" aria-live="polite">1</span>
</div>

<main id="slides">
  <section class="slide slide-title">
    <div class="slide-inner">
      <p class="eyebrow">Commercial aviation &middot; India and the Gulf</p>
      <h1>India's Wide-Body Window</h1>
      <p class="question" id="d-question"></p>
      <div class="answer">
        <span class="answer-label">The answer</span>
        <div id="d-answer"></div>
      </div>
      <p class="deck-hint">Arrow keys, space, or scroll to advance</p>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var CHART_BASE = "assets/charts/";
  var slides = document.getElementById("slides");
  var counter = document.getElementById("counter");

  function chart(name, host) {
    return fetch(CHART_BASE + name + ".json")
      .then(function (r) {
        if (!r.ok) throw new Error(name + ": HTTP " + r.status);
        return r.json();
      })
      .then(function (fig) {
        var layout = Object.assign({}, fig.layout, {
          autosize: true,
          margin: { l: 64, r: 28, t: 96, b: 84 }
        });
        return Plotly.newPlot(host, fig.data, layout, {
          displayModeBar: false,
          responsive: true
        }).then(function () {
          var title = (fig.layout.title && fig.layout.title.text) || "";
          host.setAttribute("role", "img");
          host.setAttribute("aria-label", title.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim());
        });
      })
      .catch(function (err) {
        host.innerHTML = '<p class="chart-fallback">Chart unavailable: ' + err.message + "</p>";
      });
  }

  fetch("index.html")
    .then(function (r) {
      if (!r.ok) throw new Error("index.html: HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      var src = new DOMParser().parseFromString(html, "text/html");

      var q = src.querySelector(".question");
      if (q) document.getElementById("d-question").textContent = q.textContent;
      var a = src.querySelector(".answer p");
      if (a) document.getElementById("d-answer").innerHTML = "<p>" + a.innerHTML + "</p>";

      src.querySelectorAll(".step").forEach(function (step, i) {
        var section = document.createElement("section");
        section.className = "slide";

        var inner = document.createElement("div");
        inner.className = "slide-inner slide-split";

        var text = document.createElement("div");
        text.className = "slide-text";
        var h = step.querySelector("h2");
        if (h) text.appendChild(h.cloneNode(true));

        /* Only the first two paragraphs. A slide that carries the whole step is
           a document, not a slide, and the full argument is one click away. */
        var paras = step.querySelectorAll("p:not(.aside)");
        for (var p = 0; p < Math.min(2, paras.length); p++) {
          text.appendChild(paras[p].cloneNode(true));
        }
        inner.appendChild(text);

        var name = step.dataset.chart;
        if (name) {
          var host = document.createElement("div");
          host.className = "slide-chart";
          inner.appendChild(host);
          chart(name, host);
        }

        section.appendChild(inner);
        slides.appendChild(section);
      });

      wire();
    })
    .catch(function (err) {
      slides.insertAdjacentHTML("beforeend",
        '<section class="slide"><div class="slide-inner"><p class="chart-fallback">' +
        "Could not assemble the deck: " + err.message +
        ". It reads index.html from the same directory, so it needs to be served over http." +
        "</p></div></section>");
    });

  function wire() {
    var all = Array.prototype.slice.call(document.querySelectorAll(".slide"));
    var at = 0;

    function go(n) {
      at = Math.max(0, Math.min(all.length - 1, n));
      all[at].scrollIntoView({ behavior: "smooth" });
      counter.textContent = at + 1 + " / " + all.length;
    }
    counter.textContent = "1 / " + all.length;

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown" ||
          (e.key === " " && !e.shiftKey)) {
        e.preventDefault(); go(at + 1);
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp" ||
                 (e.key === " " && e.shiftKey)) {
        e.preventDefault(); go(at - 1);
      } else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(all.length - 1); }
    });

    /* Scrolling is not hijacked, so the counter has to follow the scroll rather
       than only the keys. */
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            at = all.indexOf(entry.target);
            counter.textContent = at + 1 + " / " + all.length;
          }
        });
      }, { threshold: 0.6 });
      all.forEach(function (s) { io.observe(s); });
    }
  }
})();
</script>
</body>
</html>
